name: gate

# 与本地 `pnpm gate` 同源，但**不是同一条链**：这里只跑不依赖无头 Chrome 的那几步
# （安装 → lint → 构建 → 类型检查 → 测试 → 许可审计）；`smoke:build` / `bundle:offline` /
# `smoke:build:file` / `docs:check` 不在此文件内，因此它**比 `pnpm gate` 弱**。
#
# 步骤顺序须与 `scripts/gate.mjs` 的 `STEPS` 一致，尤其**构建必须先于类型检查**：
# 消费者的 typecheck 经各包 `exports.types` → `dist/*.d.ts` 解析工作区依赖，而 `dist/` 不入库，
# 顺序反了在干净检出上必然红（首次真实运行即因此失败，见 docs/02-adr/附录/0001-增补.md）。
on:
  push:
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.6

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: pnpm

      # 差分测试需要 Python 3：
      # - G2 的 `schedule.differential.spec.ts` 与 `tools/cpm-reference/` 比对；
      # - G3 的 `xlsx.differential.spec.ts` 与 `tools/xlsx-reference/` 比对，**另需 `openpyxl==3.1.5`**。
      # 两者都**缺失即失败、不静默跳过**（ADR 0004 §9 / ADR 0006 §12 / 裁决 P-12）。
      # ubuntu-latest 自带 `python3`，这里显式固定版本，避免"以为跑过差分、其实没跑"。
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # G3 的参照实现依赖（钉版本：ADR 0006 §12 与裁决 P-14 的 E10 实测口径）
      - name: Install Python reference deps
        run: python -m pip install --disable-pip-version-check openpyxl==3.1.5

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # 必须先于 Typecheck：见文件头注释与 scripts/gate.mjs 的 STEPS
      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: License audit
        run: pnpm license:check
