name: gate

# 等价于本地 `pnpm gate`：安装 → lint → 类型检查 → 测试 → 构建 → 许可审计。
#
# 当前门禁落在本地 pre-push 钩子（见 docs/02-adr/0001）。本文件是"接上远端即可用"的等价物：
# 在把仓库推到 GitHub 之前它不会运行，因此**尚未经过真实运行验证**，不要把它当作现有护栏。
on:
  push:
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.6

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: pnpm

      # 排程内核的差分测试（`pnpm test` 内的 `schedule.differential.spec.ts`）需要一个 Python 3
      # 解释器：**缺失即失败、不静默跳过**（ADR 0004 §9 / 裁决 P-12）。ubuntu-latest 自带
      # `python3`，这里显式固定版本，避免"以为跑过差分、其实没跑"。
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: License audit
        run: pnpm license:check
