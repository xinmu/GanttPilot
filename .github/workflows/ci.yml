name: gate

# 等价于本地 `pnpm gate`：安装 → lint → 类型检查 → 测试 → 构建 → 许可审计。
#
# 当前门禁落在本地 pre-push 钩子（见 docs/02-adr/0001）。本文件是"接上远端即可用"的等价物：
# 在把仓库推到 GitHub 之前它不会运行，因此**尚未经过真实运行验证**，不要把它当作现有护栏。
on:
  push:
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.6

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: pnpm

      # 差分测试需要 Python 3：
      # - G2 的 `schedule.differential.spec.ts` 与 `tools/cpm-reference/` 比对；
      # - G3 的 `xlsx.differential.spec.ts` 与 `tools/xlsx-reference/` 比对，**另需 `openpyxl==3.1.5`**。
      # 两者都**缺失即失败、不静默跳过**（ADR 0004 §9 / ADR 0006 §12 / 裁决 P-12）。
      # ubuntu-latest 自带 `python3`，这里显式固定版本，避免"以为跑过差分、其实没跑"。
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # G3 的参照实现依赖（钉版本：ADR 0006 §12 与裁决 P-14 的 E10 实测口径）
      - name: Install Python reference deps
        run: python -m pip install --disable-pip-version-check openpyxl==3.1.5

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: License audit
        run: pnpm license:check
