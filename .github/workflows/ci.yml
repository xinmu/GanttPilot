name: gate

# 与本地 `pnpm gate` 同源，但**不是同一条链**。各步的**相对顺序**与 `scripts/gate.mjs` 的 `STEPS` 一致
# （取子序列，不重排）；本文件跑九步里的 **7 步**，缺的两步与原因写在下面。
#
# 在本文件内（7）：lint → build → typecheck → test → bundle:offline → license:check → docs:check
# 不在本文件内（2）：
#   - `smoke:build` / `smoke:build:file`：**需要本机无头 Chrome**。`ubuntu-latest` 自带 Chrome、
#     且 `scripts/smoke-build.mjs` 已支持 `GANTTTPILOT_CHROME`，但"到底能不能补"**标记为未验证**
#     （依据见 docs/04-refactor/05-登记与本轮不做.md §二），**不由本文件自行决定**。
#   ⇒ 远端 CI 仍**弱于**本地九步：Chrome 侧的两条主链路（含 DOM 互证）只有本地能验。
#     （`Install` 与 `Install Python reference deps` 是前置动作，不计数为门禁步。）
#
# 步骤顺序须与 `scripts/gate.mjs` 的 `STEPS` 一致，尤其**构建必须先于类型检查**：
# 消费者的 typecheck 经各包 `exports.types` → `dist/*.d.ts` 解析工作区依赖，而 `dist/` 不入库，
# 顺序反了在干净检出上必然红（首次真实运行即因此失败，见 docs/02-adr/附录/0001-增补.md）。
on:
  push:
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.6

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: pnpm

      # 差分测试需要 Python 3：
      # - G2 的 `schedule.differential.spec.ts` 与 `tools/cpm-reference/` 比对；
      # - G3 的 `xlsx.differential.spec.ts` 与 `tools/xlsx-reference/` 比对，**另需 `openpyxl==3.1.5`**。
      # 两者都**缺失即失败、不静默跳过**（ADR 0004 §9 / ADR 0006 §12 / 裁决 P-12）。
      # ubuntu-latest 自带 `python3`，这里显式固定版本，避免"以为跑过差分、其实没跑"。
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # G3 的参照实现依赖（钉版本：ADR 0006 §12 与裁决 P-14 的 E10 实测口径）
      - name: Install Python reference deps
        run: python -m pip install --disable-pip-version-check openpyxl==3.1.5

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # 必须先于 Typecheck：见文件头注释与 scripts/gate.mjs 的 STEPS
      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # 仅 Node、**实测不需要 Chrome**（scripts/bundle-offline.mjs 全文 0 次 chrome）；
      # 位置与 STEPS 一致：在 test 之后、license:check 之前
      - name: Bundle (offline single file)
        run: pnpm bundle:offline

      - name: License audit
        run: pnpm license:check

      # 仅 Node（九步里最便宜、却是 142 份文档的唯一自动守卫）；位置与 STEPS 一致：最后一步。
      # 曾经缺席的代价已实测：23 处引用已删 spike 目录、其中 12 处不在白名单内，门禁仍然是绿的
      # （docs/04-refactor/05-登记与本轮不做.md §二）。
      - name: Docs check
        run: pnpm docs:check
